name: pocketserver
description: PocketServer Control Plane - Flutter app for managing pocketd daemon
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.22.x

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  unix_socket: ^1.0.0
  fl_chart: ^0.68.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.0.0
  encrypted_shared_preferences: ^3.0.0
  path_provider: ^2.1.3
  archive: ^3.5.1
  dio: ^5.4.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  file_picker: ^8.0.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
